[workspace]
members = [
    "crates/pocketpy-sys",
    "crates/kipferl-cli",
    "crates/kipferl-format",
    "crates/kipferl-loader",
    "crates/kipferl-runtime",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/niklas-heer/kipferl"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Keep review policy active in editors and ordinary Cargo commands as well as CI.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
# Reject accidental debug output, placeholder panics, and panicking time math.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
