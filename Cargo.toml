[workspace]
members = [
    "crates/pocketpy-sys",
    "crates/kipferl-cli",
    "crates/kipferl-format",
    "crates/kipferl-loader",
    "crates/kipferl-runtime",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/niklas-heer/kipferl"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
