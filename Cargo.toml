[workspace]
members = [
    "crates/pocketpy-sys",
    "crates/ucharm-runtime",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ucharmdev/ucharm"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
