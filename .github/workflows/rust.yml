name: Rust Migration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Rust build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Rust-hosted runtime
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=musl-gcc
          fi
          cargo build --release -p ucharm-runtime --target ${{ matrix.target }}
      - name: Smoke-test Rust-hosted runtime
        shell: bash
        run: >-
          target/${{ matrix.target }}/release/pocketpy-ucharm-rs
          -c 'import _ucharm_rust; assert _ucharm_rust.answer() == 42'
      - name: Enforce initial runtime size budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          binary = Path("target/${{ matrix.target }}/release/pocketpy-ucharm-rs")
          size = binary.stat().st_size
          print(f"{binary}: {size:,} bytes")
          assert size < 2_000_000, f"initial Rust spine exceeds 2 MB: {size:,} bytes"
          PY
