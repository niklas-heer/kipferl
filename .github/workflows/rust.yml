name: Rust Migration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ffi-sanitizers:
    name: PocketPy FFI sanitizers
    runs-on: ubuntu-24.04
    env:
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -C link-arg=-fsanitize=address -C link-arg=-fsanitize=undefined -C link-arg=-lasan -C link-arg=-lubsan
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      LSAN_OPTIONS: exitcode=23
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Build instrumented PocketPy tests
        run: cargo test -p ucharm-runtime --lib --test ffi_stress --no-run
      - name: Stress PocketPy callbacks and lifecycle
        shell: bash
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          test_count=0
          while IFS= read -r test_binary; do
            "$test_binary" --test-threads=1
            test_count=$((test_count + 1))
          done < <(find target/debug/deps -maxdepth 1 -type f -executable \( -name 'ucharm_runtime-*' -o -name 'ffi_stress-*' \) | sort)
          test "$test_count" -eq 2

  build:
    name: Rust build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Rust-hosted runtime
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=musl-gcc
          fi
          cargo build --release --workspace --target ${{ matrix.target }}
      - name: Smoke-test Rust-hosted runtime
        shell: bash
        run: >-
          target/${{ matrix.target }}/release/pocketpy-ucharm-rs
          -c 'import ansi, args, base64, binascii, charm, copy, errno, fnmatch, heapq, input, itertools, statistics, term, textwrap, typing; assert ansi.fg("red") == "\x1b[31m"; assert args.count() == 1; assert base64.urlsafe_b64decode(base64.urlsafe_b64encode(b"\xfb\xfc")) == b"\xfb\xfc"; assert binascii.crc32(b"123456789") == 3421780262; assert charm.BORDER_ROUNDED == 0; assert charm.visible_len(charm.style("界", fg="red")) == 2; sample = [[1]]; duplicate = copy.deepcopy(sample); assert duplicate == sample; assert duplicate is not sample; assert duplicate[0] is not sample[0]; assert errno.errorcode[errno.ENOENT] == "ENOENT"; assert OSError(errno.ENOENT, "ignored").args == (errno.ENOENT,); assert fnmatch.filter(["alpha", "beta"], "a*") == ["alpha"]; assert heapq.nsmallest(2, [3, 1, 2]) == [1, 2]; assert input.select("", []) is None; assert input.multiselect("", []) == []; assert itertools.islice(itertools.count(1, 2), 3) == [1, 3, 5]; assert statistics.mode([1, 2, 1]) == 1; assert statistics.variance([1, 2, 3, 4, 5]) == 2.5; assert len(term.size()) == 2; assert term.raw_mode(False) is None; assert textwrap.wrap("alpha beta", 5) == ["alpha"]; marker = []; assert typing.cast(list, marker) is marker; assert typing.TYPE_CHECKING is False'
      - name: Smoke-test Rust CLI
        shell: bash
        run: target/${{ matrix.target }}/release/ucharm-rs --version | grep -q "μcharm"
      - name: Smoke-test bare loader diagnostics
        shell: bash
        run: |
          if target/${{ matrix.target }}/release/ucharm-loader >loader.out 2>&1; then
            echo "bare loader unexpectedly succeeded"
            exit 1
          fi
          grep -q "invalid universal trailer" loader.out
      - name: Enforce initial runtime size budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          binary = Path("target/${{ matrix.target }}/release/pocketpy-ucharm-rs")
          size = binary.stat().st_size
          print(f"{binary}: {size:,} bytes")
          assert size < 2_000_000, f"initial Rust spine exceeds 2 MB: {size:,} bytes"

          loader = Path("target/${{ matrix.target }}/release/ucharm-loader")
          loader_size = loader.stat().st_size
          print(f"{loader}: {loader_size:,} bytes")
          assert loader_size < 1_000_000, f"Rust loader exceeds 1 MB: {loader_size:,} bytes"

          cli = Path("target/${{ matrix.target }}/release/ucharm-rs")
          cli_size = cli.stat().st_size
          print(f"{cli}: {cli_size:,} bytes")
          assert cli_size < 3_500_000, f"Rust CLI with embedded runtime exceeds 3.5 MB: {cli_size:,} bytes"
          PY
