name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-components:
    name: Build runtime and loader (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: linux-aarch64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Rust runtime and loader
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=musl-gcc
          fi
          cargo build --release \
            -p kipferl-runtime \
            -p kipferl-loader \
            --target ${{ matrix.target }}

      - name: Collect component assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/pocketpy-kipferl \
            release-assets/pocketpy-kipferl-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/kipferl-loader \
            release-assets/kipferl-loader-${{ matrix.suffix }}

      - name: Build tree-shaken core runtime
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=musl-gcc
          fi
          cargo build --release \
            -p kipferl-runtime \
            --no-default-features \
            --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pocketpy-kipferl \
            release-assets/pocketpy-kipferl-core-${{ matrix.suffix }}

      - name: Verify static Linux components
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for path in \
            release-assets/pocketpy-kipferl-${{ matrix.suffix }} \
            release-assets/pocketpy-kipferl-core-${{ matrix.suffix }} \
            release-assets/kipferl-loader-${{ matrix.suffix }}; do
            file "$path"
            if readelf -l "$path" | grep -q "INTERP"; then
              echo "$path unexpectedly contains a dynamic interpreter" >&2
              exit 1
            fi
          done

      - name: Checksum component assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for component in [
              Path("release-assets/pocketpy-kipferl-${{ matrix.suffix }}"),
              Path("release-assets/pocketpy-kipferl-core-${{ matrix.suffix }}"),
              Path("release-assets/kipferl-loader-${{ matrix.suffix }}"),
          ]:
              digest = hashlib.sha256(component.read_bytes()).hexdigest()
              component.with_name(component.name + ".sha256").write_text(
                  f"{digest}  {component.name}\n"
              )
          PY

      - name: Upload component assets
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ matrix.suffix }}
          path: release-assets/

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: build-components
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: linux-aarch64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download current Rust component assets
        uses: actions/download-artifact@v4
        with:
          pattern: components-*
          path: release-inputs
          merge-multiple: true

      - name: Refresh CLI embedded assets
        shell: bash
        run: |
          find release-inputs -type f ! -name '*.sha256' \
            -exec cp {} crates/kipferl-cli/assets/ \;

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Rust CLI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=musl-gcc
          fi
          cargo build --release -p kipferl-cli --target ${{ matrix.target }}

      - name: Verify static Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          path="target/${{ matrix.target }}/release/kipferl"
          file "$path"
          if readelf -l "$path" | grep -q "INTERP"; then
            echo "$path unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi

      - name: Smoke-test release candidate
        shell: bash
        run: |
          cli="target/${{ matrix.target }}/release/kipferl"
          "$cli" --version | grep -q "Kipferl"
          smoke_dir="$RUNNER_TEMP/kipferl-release-smoke"
          mkdir -p "$smoke_dir"
          printf '%s\n' 'print("rust release")' > "$smoke_dir/app.py"
          "$cli" build "$smoke_dir/app.py" \
            -o "$smoke_dir/app" \
            --target ${{ matrix.suffix }}
          "$smoke_dir/app" | grep -q "rust release"

      - name: Collect CLI asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/kipferl \
            release-assets/kipferl-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/kipferl \
            release-assets/ucharm-${{ matrix.suffix }}
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for cli in [
              Path("release-assets/kipferl-${{ matrix.suffix }}"),
              Path("release-assets/ucharm-${{ matrix.suffix }}"),
          ]:
              digest = hashlib.sha256(cli.read_bytes()).hexdigest()
              cli.with_name(cli.name + ".sha256").write_text(
                  f"{digest}  {cli.name}\n"
              )
          PY

      - name: Upload CLI asset
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.suffix }}
          path: release-assets/

  release-evidence:
    name: Verify release evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and replay PocketPy vendor patchset
        run: >-
          python3 scripts/verify-pocketpy-patches.py
          --check-upstream
          --report release-evidence/pocketpy-patch-verification.json
      - name: Build canonical runtime
        run: cargo build --release -p kipferl-runtime
      - name: Generate and enforce compatibility report
        run: >-
          python3 tests/compat_runner.py
          --runtime target/release/pocketpy-kipferl
          --report
          --output release-evidence/compatibility-report.md
      - name: Generate and enforce Vision report
        run: >-
          python3 tests/vision/run_vision.py
          --runtime target/release/pocketpy-kipferl
          --report release-evidence/vision-report.md
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/

  release:
    name: Create Release
    needs: [build-components, build-cli, release-evidence]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'kipferl-*' -o \
            -name 'ucharm-*' -o \
            -name 'pocketpy-kipferl-*' -o \
            -name 'kipferl-loader-*' -o \
            -name 'compatibility-report.md' -o \
            -name 'pocketpy-patch-verification.json' \
          \) -exec cp {} release/ \;
          find release -type f \( \
            -name 'kipferl-*' -o \
            -name 'ucharm-*' -o \
            -name 'pocketpy-kipferl-*' -o \
            -name 'kipferl-loader-*' \
          \) ! -name '*.sha256' -exec chmod +x {} +
          ls -la release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release-note dependencies
        run: pip install requests

      - name: Generate AI-powered release notes
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_MODEL: anthropic/claude-haiku-4.5
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          export PREV_TAG
          python3 .github/scripts/generate_release_notes.py > release_notes.md
          cat release_notes.md
          {
            echo "changelog<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: release/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kipferl repository
        uses: actions/checkout@v5
        with:
          path: kipferl

      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v5
        with:
          repository: niklas-heer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd kipferl
          ./scripts/update-homebrew.sh "$VERSION"

      - name: Commit and push changes
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kipferl.rb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update kipferl to v${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Create summary
        run: |
          echo "## Homebrew Tap Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Formula updated to version **v${{ steps.version.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "brew install niklas-heer/tap/kipferl" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
